<!DOCTYPE html>
<html lang="en" xmlns:o="urn:schemas-microsoft-com:office:office">
    <head>
        <title>Promotional Email</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--[if gte mso 9]>
        <xml>
            <o:OfficeDocumentSettings>
                <o:AllowPNG/>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
        <![endif]-->
    </head>

    <body style="margin: 0; padding: 0; background-color: #f4f4f4;">
        <!-- Preheader text -->
        <div style="display: none;
                    font-size: 1px;
                    color:#f4f4f4;
                    line-height: 1px;
                    max-height: 0;
                    max-width: 0;
                    opacity: 0;
                    overflow: hidden;
                    mso-hide: all;">
            Discover the Zora's Scale Backpack at 50% off!
        </div>
                    
        <table width="100%" border="0" cellspacing="0" cellpadding="0" bgcolor="#f4f4f4" style="background-color: #f4f4f4" role="presentation">
            <tr>
                <td align="center">       
                    <table width="600" align="center" style="border-collapse: collapse; background-color: rgb(255, 255, 255); width: 100%; max-width: 600px;" role="presentation">
                        <tr>
                            <td style="padding: 20px; text-align: center;">Zora's Fabric Ltd.</td>
                        </tr>
                    
                        <tr>
                            <td style="padding: 0;"><img src="zora-backpack.jpg" width="600" alt="Zora's Scale Backpack" style="display: block; width: 100%; max-width: 600px; height: auto;"></td>
                        </tr>
                    
                        <tr>
                            <td style="padding: 40px 30px; text-align: center;">
                                <h2 style="color: navy; font-family: sans-serif; margin: 0;">Zora's Scale Backpack at 50% off!</h2>
                            </td>
                        </tr>
                    
                        <tr>
                            <td style="padding: 0px 30px 40px 30px; text-align: center;">
                                <table role="presentation" border="0" cellpadding="0" cellspacing="0" align="center">
                                    <tr>
                                        <td align="center">
                                        
                                        <!-- Outlook desktop version -->
                                        <!--[if mso]>
                                        <v:roundrect
                                            xmlns:v="urn:schemas-microsoft-com:vml"
                                            xmlns:w="urn:schemas-microsoft-com:office:word"
                                            href="#"
                                            style="height:45px;v-text-anchor:middle;width:162px;"
                                            arcsize="11%"
                                            strokecolor="#000000"
                                            strokeweight="1px"
                                            fillcolor="#ffff00">
                                            <w:anchorlock/>
                                            <center style="color:#000000;font-family:Arial,sans-serif;font-size:16px;font-weight:bold;">
                                                BUY NOW!
                                            </center>
                                        </v:roundrect>
                                        <![endif]-->
                                        
                            <!-- Regular HTML version for other email clients -->
                            <!--[if !mso]><!-- -->
                                            <a href="#"
                                            style="background-color:#ffff00;
                                                border:1px solid #000000;
                                                border-radius:5px;
                                                color:#000000;
                                                display:inline-block;
                                                font-family:Arial,sans-serif;
                                                font-size:16px;
                                                font-weight:bold;
                                                line-height:43px;
                                                text-align:center;
                                                text-decoration:none;
                                                width:160px;">
                                                BUY NOW!
                                            </a>
                            <!--<![endif]-->
                                        
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>

</html>
